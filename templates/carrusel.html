{% extends "base.html" %}
{% load static %}

{% block head %}
<title>Carrusel</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
{% endblock %}

{% block content %}

<br><br><br>

<div id="myCarousel" class="carousel slide" data-ride="carousel" style="width:70%; margin:auto;">

    <!-- Indicadores -->
    <ol class="carousel-indicators">
        <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
        <li data-target="#myCarousel" data-slide-to="1"></li>
        <li data-target="#myCarousel" data-slide-to="2"></li>
    </ol>

    <!-- Imágenes -->
    <div class="carousel-inner">

        <div class="item active">
            <img src="{% static 'images/chica1.jpg' %}" style="width:100%; height:400px; object-fit:cover;">
            <div class="carousel-caption">
                <h3>Imagen 1</h3>
            </div>
        </div>

        <div class="item">
            <img src="{% static 'images/chica2.jpg' %}" style="width:100%; height:400px; object-fit:cover;">
            <div class="carousel-caption">
                <h3>Imagen 2</h3>
            </div>
        </div>

        <div class="item">
            <img src="{% static 'images/chica3.jpg' %}" style="width:100%; height:400px; object-fit:cover;">
            <div class="carousel-caption">
                <h3>Imagen 3</h3>
            </div>
        </div>

    </div>

    <!-- Controles -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
        <span class="glyphicon glyphicon-chevron-left"></span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
        <span class="glyphicon glyphicon-chevron-right"></span>
    </a>

</div>

{% endblock %}
